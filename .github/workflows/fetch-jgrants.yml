name: Fetch jGrants

on:
  workflow_dispatch: {}
  pull_request:
    branches:
      - main
  # 毎日自動実行したいときは以下を有効化（UTC21:00=JST朝6時）
  # schedule:
  #   - cron: "0 21 * * *"

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke tests
        run: |
          pytest -q

      - name: Run jGrants fetch (small run)
        run: |
          mkdir -p data
          python etl/fetch_jgrants.py --out data/jgrants.csv \
            --max-keywords 20 --max-pages 30 --page-size 20 --sleep 0.5

      - name: Upload jGrants artifact
        uses: actions/upload-artifact@v4
        with:
          name: jgrants-csv
          path: data/jgrants.csv
          if-no-files-found: error
          retention-days: 7
