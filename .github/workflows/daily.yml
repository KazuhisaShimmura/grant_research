name: daily_ingest
on:
  schedule:
    - cron: "30 22 * * *" # JST 07:30
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Fetch jGrants
        run: python etl/fetch_jgrants.py --out data/jgrants.jsonl
      - name: Fetch Prefecture pages
        run: |
          for pref in tokyo kanagawa saitama chiba; do
            python etl/fetch_pref_pages.py --pref $pref --out data/$pref.jsonl &
          done
          wait
      - name: Fetch SII
        run: python etl/fetch_sii.py --out data/sii.jsonl
      - name: Normalize
        run: python etl/normalize.py data/*.jsonl --out data/normalized.parquet
      - name: Dedupe & Events
        run: python etl/dedupe_and_events.py data/normalized.parquet --out data/events.parquet
      - name: Authenticate to Google Cloud
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
        if: env.GCP_PROJECT != ''
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_JSON }}'
      - name: Load to BigQuery
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          BQ_DATASET:  grants_hc
          BQ_TABLE:    programs
        if: env.GCP_PROJECT != ''
        run: python etl/load_bq.py data/events.parquet
      - name: Notify (Slack/Email)
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        if: env.SLACK_WEBHOOK != ''
        run: python etl/notify.py --mode weekly_digest
      - name: Upload all data artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-data-artifacts
          path: data/